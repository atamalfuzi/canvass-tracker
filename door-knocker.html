<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Knocker</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .container { max-width: 600px; }
        .form-group { margin-bottom: 1.3rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.95rem; color: #202124; }
        .required::after { content: " *"; color: #d33b27; }
        input[type="text"], input[type="email"], input[type="tel"], textarea, select { width: 100%; padding: 0.75rem; border: 1px solid #dadce0; border-radius: 4px; font-size: 1rem; font-family: inherit; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.1); }
        #support-level.outcome-red { background: #fee2e2; border-color: #dc2626; color: #991b1b; }
        #support-level.outcome-dark { background: #1f2937; border-color: #111827; color: #fff; }
        #support-level.outcome-green { background: #dcfce7; border-color: #16a34a; color: #166534; }
        #support-level.outcome-yellow { background: #fef9c3; border-color: #eab308; color: #854d0e; }
        #support-level.outcome-gray { background: #e5e7eb; border-color: #9ca3af; color: #374151; }
        textarea { resize: vertical; min-height: 80px; }
        .checkbox-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        .checkbox-item { display: flex; align-items: center; }
        .checkbox-item input[type="checkbox"] { width: 1.2rem; height: 1.2rem; cursor: pointer; accent-color: #1a73e8; margin-right: 0.5rem; }
        .checkbox-item label { margin-bottom: 0; cursor: pointer; font-weight: normal; font-size: 0.95rem; }
        .message { padding: 1rem; border-radius: 4px; margin-bottom: 1rem; display: none; font-weight: 500; }
        .message.show { display: block; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button[type="submit"] { width: 100%; padding: 1rem; border: none; border-radius: 4px; font-size: 1.1rem; font-weight: 700; cursor: pointer; background: #1a73e8; color: white; }
        button[type="submit"]:hover:not(:disabled) { background: #1557b0; }
        button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; opacity: 0.6; }
        @media (max-width: 600px) {
            .checkbox-group { grid-template-columns: 1fr; }
            input, textarea, select { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Door Knocker</h1>
            <p>Coquitlam canvassing</p>
        </header>

        <div class="status-bar">
            <div id="connection-status" class="status">Connecting...</div>
        </div>

        <main>
            <div id="message" class="message" role="status"></div>

            <form id="entry-form">
                <div class="form-group">
                    <label for="street-address" class="required">Street address</label>
                    <input type="text" id="street-address" required placeholder="e.g. 123 Smith Ave" autofocus>
                </div>

                <div class="form-group">
                    <label for="unit-number">Unit</label>
                    <input type="text" id="unit-number" placeholder="e.g. 205">
                </div>

                <div class="form-group">
                    <label for="postal-code">Postal code</label>
                    <input type="text" id="postal-code" placeholder="e.g. V3E 3N3">
                </div>

                <div class="form-group">
                    <label for="route-area">Polling station</label>
                    <select id="route-area">
                        <option value="">Not sure</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="support-level" class="required">Door result</label>
                    <select id="support-level" required>
                        <option value="">Choose one</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Issues raised</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-housing" value="Housing" class="issue-checkbox">
                            <label for="issue-housing">Housing</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-taxes" value="Taxes" class="issue-checkbox">
                            <label for="issue-taxes">Taxes</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-transit" value="Transit" class="issue-checkbox">
                            <label for="issue-transit">Transit</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-traffic" value="Traffic" class="issue-checkbox">
                            <label for="issue-traffic">Traffic</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-safety" value="Public safety" class="issue-checkbox">
                            <label for="issue-safety">Public safety</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-parks" value="Parks and recreation" class="issue-checkbox">
                            <label for="issue-parks">Parks and rec</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-business" value="Small business" class="issue-checkbox">
                            <label for="issue-business">Small business</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-climate" value="Climate / environment" class="issue-checkbox">
                            <label for="issue-climate">Climate</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-dev" value="Development / zoning" class="issue-checkbox">
                            <label for="issue-dev">Development and zoning</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-services" value="City services" class="issue-checkbox">
                            <label for="issue-services">City services</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="issue-other" value="Other" class="issue-checkbox">
                            <label for="issue-other">Other</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="follow-up-needed">Follow-up needed?</label>
                    <select id="follow-up-needed">
                        <option value="">Not asked</option>
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="first-name">First name</label>
                    <input type="text" id="first-name" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="last-name">Last name</label>
                    <input type="text" id="last-name" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" autocomplete="off">
                </div>

                <div class="form-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="lawn-sign">
                        <label for="lawn-sign">Wants a lawn sign</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes"></textarea>
                </div>

                <button type="submit">Save</button>
            </form>
        </main>

        <footer id="footer">Each response is saved to the campaign's Google Sheet.</footer>
    </div>

    <script src="shared.js"></script>
    <script>
        const doorKnocker = {
            init() {
                const stations = document.getElementById('route-area');
                POLLING_STATIONS.filter(station => station.kind === 'regular').forEach(station => stations.add(new Option(stationLabel(station))));
                const outcomes = document.getElementById('support-level');
                OUTCOMES.forEach((_, name) => outcomes.add(new Option(name)));
                outcomes.addEventListener('change', () => this.colorOutcome());
                document.getElementById('entry-form').addEventListener('submit', event => {
                    event.preventDefault();
                    this.submitRecord();
                });
                this.checkConnection();
            },

            checkConnection() {
                if (DEMO) {
                    this.setStatus('Demo data', true);
                    document.getElementById('footer').textContent = 'Demo: responses are saved in this browser only.';
                    return;
                }
                // Any JSON reply means the web app is reachable. The "Invalid action" answer is fine here.
                fetch(WEBAPP_URL)
                    .then(response => response.json())
                    .then(() => this.setStatus('Connected', true))
                    .catch(() => this.setStatus("Can't reach the sheet", false));
            },

            setStatus(text, ok) {
                const status = document.getElementById('connection-status');
                status.textContent = text;
                status.className = ok ? 'status connected' : 'status';
            },

            colorOutcome() {
                const select = document.getElementById('support-level');
                const outcome = OUTCOMES.get(select.value);
                select.className = outcome ? 'outcome-' + outcome.tone : '';
            },

            async submitRecord() {
                const form = document.getElementById('entry-form');
                const value = id => document.getElementById(id).value.trim();
                const street = value('street-address');
                const unit = value('unit-number');
                const doorId = unit ? `${street} Unit ${unit}` : street;
                const submitButton = form.querySelector('button[type="submit"]');
                submitButton.disabled = true;

                try {
                    await api({
                        action: 'addDoor',
                        timestamp: new Date().toISOString(),
                        streetAddress: street,
                        unitNumber: unit,
                        postalCode: value('postal-code'),
                        routeArea: value('route-area'),
                        supportLevel: value('support-level'),
                        mainIssueDiscussed: [...document.querySelectorAll('.issue-checkbox:checked')].map(box => box.value).join('; '),
                        followUpNeeded: value('follow-up-needed'),
                        firstName: value('first-name'),
                        lastName: value('last-name'),
                        email: value('email'),
                        phone: value('phone'),
                        lawnSign: document.getElementById('lawn-sign').checked ? 'Yes' : 'No',
                        contacted: 'Yes',
                        notes: value('notes'),
                        mapAddress: `${street}, Coquitlam, BC`,
                        latitude: '',
                        longitude: '',
                        doorId
                    }, true);
                    this.showMessage('Saved ' + doorId, 'success');
                    // Volunteers walk one area at a time, so keep the station for the next door.
                    const station = value('route-area');
                    form.reset();
                    this.colorOutcome();
                    document.getElementById('route-area').value = station;
                    document.getElementById('street-address').focus();
                } catch (error) {
                    this.showMessage(error instanceof TypeError ? "Couldn't reach the sheet. Try again." : 'Not saved: ' + error.message, 'error');
                } finally {
                    submitButton.disabled = false;
                }
            },

            showMessage(text, type) {
                const message = document.getElementById('message');
                message.textContent = text;
                message.className = 'message show ' + type;
                setTimeout(() => message.classList.remove('show'), 3500);
            }
        };

        document.addEventListener('DOMContentLoaded', () => doorKnocker.init());
    </script>
</body>
</html>
